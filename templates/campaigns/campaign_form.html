{% extends "base.html" %}
{% block title %}{{ title }} – CRM{% endblock %}
{% block content %}
<h2 class="mb-4">{{ title }}</h2>
<div class="row">
  <div class="col-md-6">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
        <div class="invalid-feedback d-block">{{ field.errors.0 }}</div>
        {% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Speichern</button>
      <a href="{% url 'campaigns:campaign_list' %}" class="btn btn-secondary">Abbrechen</a>
    </form>
  </div>
</div>
{% endblock %}
